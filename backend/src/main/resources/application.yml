server:
  port: ${PORT:8084}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://YOUR_HOST:5432/YOUR_DB?sslmode=require}
    username: ${SPRING_DATASOURCE_USERNAME:your_db_user}
    password: ${SPRING_DATASOURCE_PASSWORD:your_db_password}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
app:
  upload-dir: ${UPLOAD_DIR:uploads}
  ollama-url: ${OLLAMA_URL:http://127.0.0.1:11434}
  ollama-model: ${OLLAMA_MODEL:qwen2.5:3b}
  ollama-api-key: ${OLLAMA_API_KEY:}
  gemini-api-key: ${GEMINI_API_KEY:your_gemini_api_key}
  gemini-model: ${GEMINI_MODEL:gemini-3.8-flash}
jwt:
  secret: ${JWT_SECRET:change-me-super-secret-key-please-change-in-production}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
